# Reporting period. Leave start/end empty to track the current Redis fiscal
# quarter automatically (FY starts Feb 1: Q1 Feb-Apr, Q2 May-Jul,
# Q3 Aug-Oct, Q4 Nov-Jan). Set both to pin a fixed period, e.g.:
#   start: 2026-05-01
#   end: 2026-08-01
#   label: Q2FY27
quarter:
  start:
  end:
  label:

# Items whose first response took longer than this count as detractors.
slow_threshold_hours: 48
